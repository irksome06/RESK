# ==============================================================================
# Eclipse Mosquitto Local Development Configuration
# ==============================================================================
# WARNING: This configuration allows anonymous access and runs without TLS.
# It is strictly intended for local hackathon development and testing.
# For production SME deployment:
#  - Enable TLS encryption (port 8883) with valid X.509 certificates
#  - Disable anonymous access (allow_anonymous false)
#  - Enforce password files or JWT / OAuth2 gateway authentication
#  - Restrict machine topic access via Access Control Lists (ACLs)
# ==============================================================================

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
